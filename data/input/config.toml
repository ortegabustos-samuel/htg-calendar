# Parámetros 
[horizonte]
# Año a resolver: el cuadrante va del 1 de enero al 31 de diciembre.
# validador comprueba además que los festivos sean de este año.
anio = 2026

[jornada]
# Jornada anual objetivo (h). Es el techo de TODO lo que no sea cubrir: la equidad apunta aquí,
# las cesiones de bloque aterrizan por debajo y el relleno de refuerzos para en seco al llegar.
horas_objetivo = 1776

[convenio]
# V Convenio CyL de transporte sanitario. Cambiar de convenio es cambiar estos tres números.
descanso_minimo = 12       # descanso mínimo entre jornadas (h)                          — C4
horas_max_semana = 48      # máx. horas en cualquier ventana de 7 días (deslizante)      — C6
dias_max_semana = 6        # máx. días trabajados por SEMANA ISO (lunes a domingo)       — C5

[libranzas]
# Para bajar de la jornada anual hay que quitarle días de trabajo a casi todo el mundo. Cuánto se
# quita de golpe depende de lo RÍGIDA que sea la plaza, y eso se mide con el descanso que el propio
# patrón devuelve por cada día trabajado (descanso modal / trabajo modal, ver v3/ritmo.py):
#   * ratio >= ratio_rigido -> la plaza no se fracciona. Se cede el CICLO entero (bloque de trabajo
#     + su descanso) y el cubridor asume los dos. Es el caso del binomio de noche (7 días de
#     trabajo y 7 de descanso, ratio 1,00): un día suelto de noche no tiene descanso que darle.
#   * ratio <  ratio_rigido -> plaza flexible. Se pueden ceder bloques o días sueltos, y el
#     descanso que hereda el cubridor es ratio x días cedidos.
# En los datos de Valladolid la separación es enorme (0,20-0,40 frente a 1,00), así que cualquier
# valor entre 0,45 y 0,9 da el mismo resultado.
ratio_rigido = 0.6

[reparto]
# Regla de reparto (no del convenio, como domingo_ok): si se trabajan sábado y domingo de la
# misma semana ISO, hace falta un par de días consecutivos libres entre semana (lunes-viernes).
# Vacío = libre elección de qué par, con tal de que sean consecutivos. Con dos días en español,
# consecutivos y de lunes a viernes ("martes", "miercoles"), fija exactamente cuáles.
dias_descanso_finde = []